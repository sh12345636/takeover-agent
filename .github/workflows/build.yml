# ============================================================
# TakeoverAgent 云端构建（GitHub Actions）
# 触发：手动 workflow_dispatch（可带构建参数）/ push main
# 产物：Debug APK（可直接安装）+ Release APK（unsigned）→ Actions Artifact
# ============================================================
name: Build TakeoverAgent APK

on:
  workflow_dispatch:
    inputs:
      # ---- 构建参数输入位（第 4 点预留；会注入 APK 的 assets/build_config.json）----
      api_base_url:
        description: "模型 API Base URL（如 https://api.deepseek.com/v1）"
        required: false
        default: ""
      api_model:
        description: "模型名（如 deepseek-chat）"
        required: false
        default: ""
      api_key_ref:
        description: "API Key 的 Secrets 名（推荐！填仓库 Secret 名，如 MY_API_KEY；留空则用内置 API_KEY secret）"
        required: false
        default: ""
      build_flavor:
        description: "构建类型"
        required: false
        default: "both"
        type: choice
        options: [both, debug, release]
  push:
    branches: [main]

permissions:
  contents: write   # 末尾自动发 Release 需要写权限

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 仓库无 gradle wrapper：由 setup-gradle 直接安装 Gradle 8.9（AGP 8.7 要求 ≥8.9）
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # runner 预装完整 Android SDK（cmdline-tools 16.x）；
      # 不用 android-actions/setup-android@v3 —— 它会装已被 Google 移除的 'tools' 包而失败
      - name: 安装 SDK 组件（platform / build-tools / NDK / CMake）
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          echo "using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          "$SDKM" --list_installed | grep -E "platforms;android-35|ndk;27|cmake" || true

      # ---- 注入构建参数（第 4 点）：生成 assets/build_config.json，随 APK 打包 ----
      # 敏感值优先取 Secrets：inputs.api_key_ref 指定 Secret 名，或默认 API_KEY
      - name: 注入构建参数
        env:
          IN_API_BASE_URL: ${{ inputs.api_base_url }}
          IN_API_MODEL: ${{ inputs.api_model }}
          IN_KEY_REF: ${{ inputs.api_key_ref }}
          SECRET_BY_REF: ${{ secrets[inputs.api_key_ref] }}
          SECRET_DEFAULT: ${{ secrets.API_KEY }}
        run: |
          mkdir -p app/src/main/assets
          # API Key 只从 Secrets 注入，不走明文 inputs（inputs 会进 run 日志）
          API_KEY_VALUE="${SECRET_BY_REF:-$SECRET_DEFAULT}"
          cat > app/src/main/assets/build_config.json <<EOF
          {
            "api_base_url": "$IN_API_BASE_URL",
            "api_model": "$IN_API_MODEL",
            "api_key": "$API_KEY_VALUE",
            "commit": "${GITHUB_SHA::7}",
            "built_at": "$(date -u +%FT%TZ)"
          }
          EOF
          echo "build_config.json 已生成（api_key 是否注入: $([ -n "$API_KEY_VALUE" ] && echo YES || echo NO)）"

      # ---- 还原签名材料（由 Provision Signing 写入的 Secrets，sealed-box 加密）----
      - name: 还原签名材料
        env:
          KS_B64: ${{ secrets.KEYSTORE_P12_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "SIGNED=no" >> "$GITHUB_ENV"
            echo "::warning::未配置签名 Secrets，release 将产出 unsigned APK"
            exit 0
          fi
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          cat > signing.properties <<EOF
          storeFile=$RUNNER_TEMP/release.p12
          storePassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          echo "SIGNED=yes" >> "$GITHUB_ENV"
          echo "签名材料已还原：$(stat -c%s "$RUNNER_TEMP/release.p12") bytes"

      - name: 构建 APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          FLAVOR="${{ inputs.build_flavor }}"
          case "$FLAVOR" in
            debug)   gradle --no-daemon assembleDebug ;;
            release) gradle --no-daemon assembleRelease ;;
            *)       gradle --no-daemon assembleDebug assembleRelease ;;
          esac

      - name: 校验并整理产物
        id: apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          DBG=(app/build/outputs/apk/debug/*.apk)
          REL=(app/build/outputs/apk/release/*.apk)
          echo "debug count=${#DBG[@]} release count=${#REL[@]}"
          mkdir -p dist
          [ ${#DBG[@]} -ge 1 ] && cp "${DBG[0]}" "dist/TakeoverAgent-debug.apk"
          if [ ${#REL[@]} -ge 1 ]; then
            if [ "${SIGNED:-no}" = "yes" ]; then
              cp "${REL[0]}" "dist/TakeoverAgent-release.apk"
              APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
                -name apksigner -type f | sort -V | tail -n1)"
              echo "== apksigner verify（release 签名校验）=="
              "$APKSIGNER" verify --print-certs "dist/TakeoverAgent-release.apk" | sed -n '1,8p'
            else
              cp "${REL[0]}" "dist/TakeoverAgent-release-unsigned.apk"
              echo "release: unsigned（无签名 Secrets）"
            fi
          fi
          ls -l dist/
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: 上传构建产物（Artifact，保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: TakeoverAgent-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # 手动触发时自动发 Release：APK 挂 assets，手机/PC 均可直接下载
      - name: 发布 GitHub Release（仅 workflow_dispatch）
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          NOTES="云端自动构建 · $( [ "${SIGNED:-no}" = yes ] && echo 'Release 已正式签名，可直接安装' || echo 'Release 未签名' ) · SHA256 见附件"
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "TakeoverAgent $TAG" \
            --notes "$NOTES"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_STEP_SUMMARY"
